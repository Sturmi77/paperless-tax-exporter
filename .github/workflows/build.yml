name: Build & Push Docker Image

# Jeder Push auf main/develop baut und pusht ein Image.
# PR-Merges erzeugen einen Push auf den Ziel-Branch → Image wird automatisch gebaut.
# Zusätzlich: Git-Tags v*.*.* und manueller Start (workflow_dispatch).
on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # → ghcr.io/sturmi77/paperless-tax-exporter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # Nötig für ghcr.io Push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Merge/Push auf main → :latest und :main
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            # Git-Tag v1.2.3 → :1.2.3 und :1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # develop → :develop (überschreibt nicht :latest)
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            # Jeder Build: eindeutiger Commit-SHA-Tag
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: CACHEBUST=${{ github.sha }}
